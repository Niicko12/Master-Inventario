<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" fill="none">
  <defs>
    <linearGradient id="inventoryBg" x1="0" y1="0" x2="360" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFF4FF"/>
      <stop offset="1" stop-color="#E9FFF7"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8ACBFF"/>
      <stop offset="1" stop-color="#66B5F7"/>
    </linearGradient>
    <linearGradient id="boxFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#49BEFF"/>
      <stop offset="1" stop-color="#5D87FF"/>
    </linearGradient>
    <linearGradient id="leafAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13DEB9"/>
      <stop offset="1" stop-color="#2DCFAF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#5D87FF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="360" height="150" rx="20" fill="url(#inventoryBg)"/>
  <ellipse cx="190" cy="128" rx="132" ry="12" fill="#CFE9F9"/>

  <!-- Caja 1 -->
  <g filter="url(#softShadow)">
    <rect x="85" y="74" width="70" height="44" rx="8" fill="url(#boxFace)"/>
    <path d="M85 82L120 60L155 82L120 104L85 82Z" fill="url(#boxTop)"/>
    <rect x="117.5" y="60" width="5" height="58" rx="2.5" fill="#B8E1FF"/>
    <rect x="99" y="92" width="42" height="4" rx="2" fill="#EAF7FF" opacity="0.7"/>
  </g>

  <!-- Caja 2 -->
  <g filter="url(#softShadow)">
    <rect x="155" y="64" width="76" height="54" rx="9" fill="url(#boxFace)"/>
    <path d="M155 74L193 50L231 74L193 98L155 74Z" fill="url(#boxTop)"/>
    <rect x="189.5" y="50" width="7" height="68" rx="3.5" fill="#B8E1FF"/>
    <rect x="171" y="89" width="46" height="5" rx="2.5" fill="#EAF7FF" opacity="0.7"/>
  </g>

  <!-- Caja 3 -->
  <g filter="url(#softShadow)">
    <rect x="229" y="78" width="58" height="40" rx="8" fill="url(#boxFace)"/>
    <path d="M229 85L258 66L287 85L258 104L229 85Z" fill="url(#boxTop)"/>
    <rect x="255.2" y="66" width="5.6" height="52" rx="2.8" fill="#B8E1FF"/>
  </g>

  <!-- Clipboard lateral -->
  <g>
    <rect x="298" y="42" width="42" height="64" rx="8" fill="#FFFFFF" stroke="#AED8F5" stroke-width="2"/>
    <rect x="309" y="36" width="20" height="10" rx="5" fill="#5D87FF"/>
    <rect x="306" y="56" width="26" height="4" rx="2" fill="#7CB4E4"/>
    <rect x="306" y="66" width="20" height="4" rx="2" fill="#93C3EA"/>
    <rect x="306" y="76" width="24" height="4" rx="2" fill="#7CB4E4"/>
    <rect x="306" y="86" width="18" height="4" rx="2" fill="#93C3EA"/>
  </g>

  <!-- Hojas decorativas -->
  <path d="M60 105C70 90 84 92 92 102C82 110 68 112 60 105Z" fill="url(#leafAccent)"/>
  <path d="M70 113C82 101 95 103 102 114C91 121 79 122 70 113Z" fill="#43D9BC" opacity="0.88"/>

  <!-- Etiqueta inventario -->
  <g>
    <rect x="122" y="18" width="128" height="24" rx="12" fill="#5D87FF" opacity="0.12"/>
    <text x="186" y="34" text-anchor="middle" fill="#3E6EF4" font-family="Arial, sans-serif" font-size="12" font-weight="700">INVENTARIO DE PRODUCTOS</text>
  </g>
</svg>
